<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 16px Arial, sans-serif; fill: #172033; }
    .small { font: 13px Arial, sans-serif; fill: #526070; }
    .pin { font: 13px Arial, sans-serif; fill: #172033; }
    .box { fill: #f7f9fc; stroke: #172033; stroke-width: 2; rx: 12; }
    .module { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 10; }
    .note { fill: #fff8dc; stroke: #b58900; stroke-width: 1.5; rx: 8; }
    .wire5v { stroke: #d93025; stroke-width: 4; fill: none; }
    .wireGnd { stroke: #202124; stroke-width: 4; fill: none; }
    .wireSig { stroke: #1a73e8; stroke-width: 4; fill: none; }
    .wireData { stroke: #9334e6; stroke-width: 4; fill: none; }
    .wireWarn { stroke: #f29900; stroke-width: 4; fill: none; }
    .wireI2c { stroke: #0f9d58; stroke-width: 4; fill: none; }
    .thin { stroke-width: 2.5; }
  </style>

  <rect width="1600" height="1100" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Arduino Uno 1 회로도 - 입구/출구 차단기 제어</text>
  <text x="60" y="88" class="subtitle">업로드 파일: sketches/uno_gate/uno_gate.ino</text>

  <!-- Arduino Uno -->
  <rect x="590" y="160" width="420" height="700" class="box"/>
  <rect x="650" y="220" width="300" height="520" fill="#2f80ed" stroke="#0f376f" stroke-width="3" rx="18"/>
  <text x="690" y="270" font-family="Arial" font-size="34" font-weight="700" fill="#fff">Arduino UNO</text>
  <text x="706" y="304" font-family="Arial" font-size="16" fill="#d9ecff">Board 1: Gate Controller</text>

  <!-- Uno pins left analog/power -->
  <g>
    <circle cx="610" cy="360" r="8" fill="#fff"/><text x="625" y="365" class="pin">5V</text>
    <circle cx="610" cy="405" r="8" fill="#fff"/><text x="625" y="410" class="pin">GND</text>
    <circle cx="610" cy="450" r="8" fill="#fff"/><text x="625" y="455" class="pin">A0</text>
    <circle cx="610" cy="495" r="8" fill="#fff"/><text x="625" y="500" class="pin">A1</text>
    <circle cx="610" cy="540" r="8" fill="#fff"/><text x="625" y="545" class="pin">A4 SDA</text>
    <circle cx="610" cy="585" r="8" fill="#fff"/><text x="625" y="590" class="pin">A5 SCL</text>
  </g>

  <!-- Uno pins right digital -->
  <g>
    <circle cx="990" cy="330" r="8" fill="#fff"/><text x="910" y="335" class="pin">D2 RX</text>
    <circle cx="990" cy="375" r="8" fill="#fff"/><text x="910" y="380" class="pin">D3 TX</text>
    <circle cx="990" cy="465" r="8" fill="#fff"/><text x="922" y="470" class="pin">D9</text>
    <circle cx="990" cy="510" r="8" fill="#fff"/><text x="915" y="515" class="pin">D10</text>
    <circle cx="990" cy="555" r="8" fill="#fff"/><text x="915" y="560" class="pin">D11</text>
    <circle cx="990" cy="600" r="8" fill="#fff"/><text x="915" y="605" class="pin">D12</text>
  </g>

  <!-- Power rails -->
  <rect x="90" y="145" width="410" height="90" class="module"/>
  <text x="120" y="180" class="label">브레드보드 전원 레일</text>
  <line x1="120" y1="205" x2="470" y2="205" class="wire5v"/>
  <text x="480" y="210" class="small">+5V</text>
  <line x1="120" y1="225" x2="470" y2="225" class="wireGnd"/>
  <text x="480" y="230" class="small">GND</text>
  <path d="M610 360 L500 360 L500 205" class="wire5v"/>
  <path d="M610 405 L520 405 L520 225" class="wireGnd"/>

  <!-- Entrance LDR -->
  <rect x="80" y="300" width="420" height="180" class="module"/>
  <text x="110" y="335" class="label">입구 조도센서 회로</text>
  <text x="110" y="365" class="small">LDR 한쪽: 5V, 고정저항: GND</text>
  <text x="110" y="390" class="small">중간 지점: A0</text>
  <circle cx="160" cy="430" r="26" fill="#fff7c2" stroke="#946200" stroke-width="2"/>
  <text x="145" y="435" class="small">LDR</text>
  <rect x="260" y="415" width="70" height="30" fill="#ffe0b2" stroke="#a15c00"/>
  <text x="268" y="435" class="small">10kΩ</text>
  <path d="M500 205 L160 205 L160 404" class="wire5v"/>
  <path d="M295 445 L295 520 L520 520 L520 225" class="wireGnd"/>
  <path d="M186 430 L260 430 L610 450" class="wireSig"/>
  <text x="350" y="424" class="small">A0 신호</text>

  <!-- Exit LDR -->
  <rect x="80" y="520" width="420" height="180" class="module"/>
  <text x="110" y="555" class="label">출구 조도센서 회로</text>
  <text x="110" y="585" class="small">차량이 가리면 값이 350 이하로 내려감</text>
  <text x="110" y="610" class="small">중간 지점: A1</text>
  <circle cx="160" cy="650" r="26" fill="#fff7c2" stroke="#946200" stroke-width="2"/>
  <text x="145" y="655" class="small">LDR</text>
  <rect x="260" y="635" width="70" height="30" fill="#ffe0b2" stroke="#a15c00"/>
  <text x="268" y="655" class="small">10kΩ</text>
  <path d="M500 205 L140 205 L140 624" class="wire5v"/>
  <path d="M295 665 L295 725 L520 725 L520 225" class="wireGnd"/>
  <path d="M186 650 L260 650 L610 495" class="wireSig"/>
  <text x="350" y="644" class="small">A1 신호</text>

  <!-- LCD -->
  <rect x="80" y="750" width="420" height="180" class="module"/>
  <text x="110" y="785" class="label">I2C LCD 16x2</text>
  <rect x="145" y="815" width="260" height="70" fill="#dff3ff" stroke="#006c9c" stroke-width="2" rx="6"/>
  <text x="180" y="855" class="label">Entrance Open / Fee</text>
  <text x="110" y="912" class="small">VCC→5V, GND→GND, SDA→A4, SCL→A5</text>
  <path d="M500 205 L430 205 L430 820" class="wire5v"/>
  <path d="M520 225 L450 225 L450 840" class="wireGnd"/>
  <path d="M610 540 L500 540 L500 865 L405 865" class="wireI2c"/>
  <path d="M610 585 L525 585 L525 890 L405 890" class="wireI2c thin"/>
  <text x="530" y="850" class="small">SDA A4</text>
  <text x="530" y="875" class="small">SCL A5</text>

  <!-- Servos -->
  <rect x="1090" y="300" width="410" height="180" class="module"/>
  <text x="1120" y="335" class="label">입구 차단기 서보</text>
  <rect x="1160" y="365" width="150" height="70" fill="#d6e4ff" stroke="#174ea6" stroke-width="2" rx="8"/>
  <text x="1195" y="407" class="label">Servo IN</text>
  <text x="1120" y="455" class="small">Signal→D9, V+→5V, GND→공통 GND</text>
  <path d="M990 465 L1160 400" class="wireSig"/>
  <path d="M500 205 L1370 205 L1370 385 L1310 385" class="wire5v"/>
  <path d="M520 225 L1390 225 L1390 420 L1310 420" class="wireGnd"/>

  <rect x="1090" y="510" width="410" height="180" class="module"/>
  <text x="1120" y="545" class="label">출구 차단기 서보</text>
  <rect x="1160" y="575" width="150" height="70" fill="#d6e4ff" stroke="#174ea6" stroke-width="2" rx="8"/>
  <text x="1195" y="617" class="label">Servo OUT</text>
  <text x="1120" y="665" class="small">Signal→D10, V+→5V, GND→공통 GND</text>
  <path d="M990 510 L1160 610" class="wireSig"/>
  <path d="M500 205 L1420 205 L1420 595 L1310 595" class="wire5v"/>
  <path d="M520 225 L1440 225 L1440 630 L1310 630" class="wireGnd"/>

  <!-- Alert LED/Buzzer -->
  <rect x="1090" y="730" width="410" height="180" class="module"/>
  <text x="1120" y="765" class="label">만차 경고 LED / 부저</text>
  <circle cx="1160" cy="815" r="22" fill="#ff6b6b" stroke="#9b1c1c" stroke-width="2"/>
  <text x="1144" y="820" class="small">LED</text>
  <rect x="1235" y="795" width="80" height="40" fill="#fce8b2" stroke="#a15c00" rx="5"/>
  <text x="1253" y="820" class="small">220Ω</text>
  <circle cx="1390" cy="815" r="26" fill="#e8eaed" stroke="#3c4043" stroke-width="2"/>
  <text x="1370" y="820" class="small">Buzzer</text>
  <text x="1120" y="880" class="small">D12→저항→LED→GND, D11→부저+ / 부저-→GND</text>
  <path d="M990 600 L1235 815" class="wireWarn"/>
  <path d="M1160 837 L1160 930 L520 930 L520 225" class="wireGnd"/>
  <path d="M990 555 L1390 789" class="wireWarn"/>
  <path d="M1390 841 L1390 950 L520 950 L520 225" class="wireGnd"/>

  <!-- Wemos connector -->
  <rect x="1060" y="70" width="470" height="170" class="note"/>
  <text x="1090" y="105" class="label">Wemos Gateway 연결</text>
  <text x="1090" y="135" class="small">Uno D2(RX) ← Wemos D6(TX)</text>
  <text x="1090" y="160" class="small">Uno D3(TX) → Wemos D5(RX)</text>
  <text x="1090" y="185" class="small">Uno GND ↔ Wemos GND 공통 연결</text>
  <text x="1090" y="215" class="small">권장: Uno TX(5V) → Wemos RX(3.3V)는 분압/레벨시프터 사용</text>
  <path d="M990 330 L1060 135" class="wireData"/>
  <path d="M990 375 L1060 160" class="wireData"/>
  <path d="M520 225 L1060 185" class="wireGnd thin"/>

  <!-- Legend -->
  <rect x="590" y="910" width="420" height="135" class="module"/>
  <text x="620" y="940" class="label">배선 색상</text>
  <line x1="620" y1="965" x2="680" y2="965" class="wire5v"/><text x="695" y="970" class="small">5V</text>
  <line x1="620" y1="990" x2="680" y2="990" class="wireGnd"/><text x="695" y="995" class="small">GND</text>
  <line x1="780" y1="965" x2="840" y2="965" class="wireSig"/><text x="855" y="970" class="small">센서/서보 신호</text>
  <line x1="780" y1="990" x2="840" y2="990" class="wireI2c"/><text x="855" y="995" class="small">I2C</text>
  <line x1="620" y1="1015" x2="680" y2="1015" class="wireData"/><text x="695" y="1020" class="small">보드 간 통신</text>
  <line x1="780" y1="1015" x2="840" y2="1015" class="wireWarn"/><text x="855" y="1020" class="small">경고 장치</text>

  <!-- Threshold note -->
  <rect x="80" y="965" width="420" height="80" class="note"/>
  <text x="110" y="995" class="label">조도 기준값</text>
  <text x="110" y="1022" class="small">평상시 400~500, 차량 통과 시 300 이하</text>
  <text x="110" y="1043" class="small">코드 기준: LIGHT_BLOCKED_THRESHOLD = 350</text>
</svg>
