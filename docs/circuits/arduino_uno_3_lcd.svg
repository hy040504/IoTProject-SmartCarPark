<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .box { fill: #ffffff; stroke: #2f3b52; stroke-width: 3; rx: 18; }
    .module { fill: #f8fbff; stroke: #7d8da8; stroke-width: 2; rx: 14; }
    .note { fill: #fff7e6; stroke: #d89b00; stroke-width: 2; rx: 12; }
    .label { font: 700 22px Arial, sans-serif; fill: #172033; }
    .small { font: 17px Arial, sans-serif; fill: #344054; }
    .pin { font: 15px Arial, sans-serif; fill: #172033; }
    .wire5v { stroke: #d93025; stroke-width: 4; fill: none; }
    .wireGnd { stroke: #202124; stroke-width: 4; fill: none; }
    .wireI2c { stroke: #0f9d58; stroke-width: 4; fill: none; }
    .wireUsb { stroke: #5f6368; stroke-width: 5; fill: none; }
  </style>

  <rect width="1500" height="950" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Arduino Uno 3 회로도 - 입구/출구 LCD 전광판</text>
  <text x="60" y="88" class="subtitle">업로드 파일: sketches/uno_lcd/uno_lcd.ino</text>

  <rect x="555" y="160" width="390" height="600" class="box"/>
  <rect x="615" y="225" width="270" height="405" fill="#2f80ed" stroke="#0f376f" stroke-width="3" rx="18"/>
  <text x="650" y="275" font-family="Arial" font-size="32" font-weight="700" fill="#fff">Arduino UNO</text>
  <text x="652" y="309" font-family="Arial" font-size="16" fill="#d9ecff">Board 3: LCD Display</text>

  <circle cx="575" cy="355" r="8" fill="#fff"/><text x="590" y="360" class="pin">5V</text>
  <circle cx="575" cy="405" r="8" fill="#fff"/><text x="590" y="410" class="pin">GND</text>
  <circle cx="575" cy="510" r="8" fill="#fff"/><text x="590" y="515" class="pin">A4 SDA</text>
  <circle cx="575" cy="560" r="8" fill="#fff"/><text x="590" y="565" class="pin">A5 SCL</text>
  <circle cx="750" cy="650" r="8" fill="#fff"/><text x="710" y="680" class="pin">USB</text>

  <rect x="80" y="145" width="390" height="115" class="module"/>
  <text x="115" y="182" class="label">브레드보드 전원 레일</text>
  <line x1="125" y1="215" x2="430" y2="215" class="wire5v"/>
  <line x1="125" y1="240" x2="430" y2="240" class="wireGnd"/>
  <text x="445" y="220" class="small">5V</text>
  <text x="445" y="245" class="small">GND</text>
  <path d="M575 355 L470 355 L470 215" class="wire5v"/>
  <path d="M575 405 L490 405 L490 240" class="wireGnd"/>

  <rect x="80" y="330" width="390" height="240" class="module"/>
  <text x="115" y="370" class="label">입구 LCD 16x2 I2C</text>
  <rect x="135" y="405" width="270" height="90" fill="#dff6dd" stroke="#188038" stroke-width="2" rx="8"/>
  <text x="165" y="455" font-family="Arial" font-size="24" font-weight="700" fill="#0b5f20">Entrance LCD</text>
  <text x="115" y="530" class="small">주소: 0x27, VCC→5V, GND→GND</text>
  <path d="M470 215 L430 215 L430 415" class="wire5v"/>
  <path d="M490 240 L450 240 L450 485" class="wireGnd"/>
  <path d="M575 510 L405 445" class="wireI2c"/>
  <path d="M575 560 L405 465" class="wireI2c"/>

  <rect x="1030" y="330" width="390" height="240" class="module"/>
  <text x="1065" y="370" class="label">출구 LCD 16x2 I2C</text>
  <rect x="1085" y="405" width="270" height="90" fill="#e8f0fe" stroke="#174ea6" stroke-width="2" rx="8"/>
  <text x="1125" y="455" font-family="Arial" font-size="24" font-weight="700" fill="#174ea6">Exit LCD</text>
  <text x="1065" y="530" class="small">주소: 0x3F, VCC→5V, GND→GND</text>
  <path d="M575 355 L1010 355 L1010 415" class="wire5v"/>
  <path d="M575 405 L990 405 L990 485" class="wireGnd"/>
  <path d="M575 510 L1085 445" class="wireI2c"/>
  <path d="M575 560 L1085 465" class="wireI2c"/>

  <rect x="1010" y="650" width="410" height="160" class="note"/>
  <text x="1045" y="690" class="label">Node.js Serial 연결</text>
  <text x="1045" y="725" class="small">PC와 USB 케이블로 연결</text>
  <text x="1045" y="755" class="small">기본 포트: LCD_SERIAL_PORT=COM7</text>
  <text x="1045" y="785" class="small">통신 속도: 9600 baud</text>
  <path d="M750 650 L1010 725" class="wireUsb"/>

  <rect x="80" y="650" width="430" height="170" class="note"/>
  <text x="115" y="690" class="label">주의</text>
  <text x="115" y="725" class="small">LCD 2개는 서로 다른 I2C 주소가 필요</text>
  <text x="115" y="755" class="small">둘 다 SDA A4, SCL A5에 병렬 연결</text>
  <text x="115" y="785" class="small">주소가 같으면 한쪽 주소를 변경해야 함</text>

  <rect x="555" y="810" width="390" height="105" class="module"/>
  <text x="590" y="845" class="label">배선 색상</text>
  <line x1="590" y1="875" x2="655" y2="875" class="wire5v"/><text x="670" y="880" class="small">5V</text>
  <line x1="760" y1="875" x2="825" y2="875" class="wireGnd"/><text x="840" y="880" class="small">GND</text>
  <line x1="590" y1="900" x2="655" y2="900" class="wireI2c"/><text x="670" y="905" class="small">I2C SDA/SCL</text>
</svg>
