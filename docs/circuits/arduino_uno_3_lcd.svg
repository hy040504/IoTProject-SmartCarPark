<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 700 22px Arial, sans-serif; fill: #172033; }
    .small { font: 16px Arial, sans-serif; fill: #344054; }
    .box { fill: #ffffff; stroke: #2f3b52; stroke-width: 3; rx: 18; }
    .module { fill: #f8fbff; stroke: #7d8da8; stroke-width: 2; rx: 14; }
    .note { fill: #fff7e6; stroke: #d89b00; stroke-width: 2; rx: 12; }
    .wire5v { stroke: #d93025; stroke-width: 4; fill: none; }
    .wireGnd { stroke: #202124; stroke-width: 4; fill: none; }
    .wireI2c { stroke: #0f9d58; stroke-width: 4; fill: none; }
    .wireUsb { stroke: #5f6368; stroke-width: 5; fill: none; }
  </style>

  <rect width="1500" height="900" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Arduino Uno 3 Circuit - Exit LCD Only</text>
  <text x="60" y="88" class="subtitle">Sketch: sketches/uno_lcd/uno_lcd.ino</text>

  <rect x="560" y="150" width="380" height="560" class="box"/>
  <rect x="620" y="220" width="260" height="380" fill="#2f80ed" stroke="#0f376f" stroke-width="3" rx="18"/>
  <text x="650" y="275" font-family="Arial" font-size="32" font-weight="700" fill="#fff">Arduino UNO</text>
  <text x="652" y="309" font-family="Arial" font-size="16" fill="#d9ecff">Board 3: Exit LCD</text>

  <circle cx="580" cy="350" r="8" fill="#fff"/><text x="595" y="355" class="small">5V</text>
  <circle cx="580" cy="405" r="8" fill="#fff"/><text x="595" y="410" class="small">GND</text>
  <circle cx="580" cy="500" r="8" fill="#fff"/><text x="595" y="505" class="small">A4 SDA</text>
  <circle cx="580" cy="550" r="8" fill="#fff"/><text x="595" y="555" class="small">A5 SCL</text>
  <circle cx="730" cy="620" r="8" fill="#fff"/><text x="700" y="650" class="small">USB Serial</text>

  <rect x="95" y="170" width="370" height="165" class="module"/>
  <text x="125" y="210" class="label">Power</text>
  <text x="125" y="246" class="small">LCD VCC connects to Uno 5V.</text>
  <text x="125" y="276" class="small">LCD GND connects to Uno GND.</text>
  <text x="125" y="306" class="small">I2C LCD backpack wiring.</text>
  <path d="M465 245 L560 245 L560 350" class="wire5v"/>
  <path d="M465 285 L560 285 L560 405" class="wireGnd"/>

  <rect x="95" y="395" width="370" height="245" class="module"/>
  <text x="125" y="435" class="label">Exit LCD 16x2 I2C</text>
  <rect x="135" y="470" width="260" height="85" fill="#e8f0fe" stroke="#174ea6" stroke-width="2" rx="8"/>
  <text x="170" y="520" font-family="Arial" font-size="24" font-weight="700" fill="#174ea6">Exit LCD</text>
  <text x="125" y="610" class="small">I2C address: 0x3F</text>
  <text x="125" y="640" class="small">Shows parking status and exit fee</text>
  <path d="M560 500 L430 500" class="wireI2c"/>
  <path d="M560 550 L430 535" class="wireI2c"/>

  <rect x="1010" y="190" width="390" height="245" class="note"/>
  <text x="1040" y="230" class="label">Node Connection</text>
  <text x="1040" y="265" class="small">Node.js sends LCD commands over USB Serial.</text>
  <text x="1040" y="295" class="small">Default port: LCD_SERIAL_PORT=COM7</text>
  <text x="1040" y="325" class="small">Commands: LCD_STATUS, LCD_EXIT_FEE</text>
  <text x="1040" y="355" class="small">Only one LCD is used now.</text>
  <path d="M730 620 L1010 315" class="wireUsb"/>

  <rect x="1010" y="480" width="390" height="185" class="note"/>
  <text x="1040" y="520" class="label">Default Screen</text>
  <text x="1040" y="555" class="small">Parking Status</text>
  <text x="1040" y="585" class="small">Cars: occupied / total</text>
  <text x="1040" y="615" class="small">Exit: Slot n Exit / Fee: amount</text>
</svg>
