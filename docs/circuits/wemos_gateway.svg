<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 16px Arial, sans-serif; fill: #172033; }
    .small { font: 13px Arial, sans-serif; fill: #526070; }
    .pin { font: 13px Arial, sans-serif; fill: #172033; }
    .box { fill: #f7f9fc; stroke: #172033; stroke-width: 2; rx: 12; }
    .module { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 10; }
    .note { fill: #fff8dc; stroke: #b58900; stroke-width: 1.5; rx: 8; }
    .wire5v { stroke: #d93025; stroke-width: 4; fill: none; }
    .wireGnd { stroke: #202124; stroke-width: 4; fill: none; }
    .wireData { stroke: #9334e6; stroke-width: 4; fill: none; }
    .wireWifi { stroke: #0f9d58; stroke-width: 4; fill: none; stroke-dasharray: 12 10; }
    .thin { stroke-width: 2.5; }
  </style>

  <rect width="1600" height="1000" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Wemos Gateway 회로도 - Uno 보드와 요금 서버 중계</text>
  <text x="60" y="88" class="subtitle">업로드 파일: sketches/wemos_gateway/wemos_gateway.ino</text>

  <!-- Wemos board -->
  <rect x="600" y="180" width="420" height="620" class="box"/>
  <rect x="675" y="255" width="270" height="410" fill="#1f8f6b" stroke="#0b4f3b" stroke-width="3" rx="18"/>
  <text x="712" y="305" font-family="Arial" font-size="32" font-weight="700" fill="#fff">Wemos D1 R1</text>
  <text x="716" y="338" font-family="Arial" font-size="16" fill="#dff8ee">Gateway Wi-Fi Board</text>

  <!-- Wemos pins -->
  <g>
    <circle cx="620" cy="320" r="8" fill="#fff"/><text x="635" y="325" class="pin">5V</text>
    <circle cx="620" cy="365" r="8" fill="#fff"/><text x="635" y="370" class="pin">GND</text>
    <circle cx="620" cy="430" r="8" fill="#fff"/><text x="635" y="435" class="pin">D5 RX Gate</text>
    <circle cx="620" cy="485" r="8" fill="#fff"/><text x="635" y="490" class="pin">D6 TX Gate</text>
    <circle cx="1000" cy="430" r="8" fill="#fff"/><text x="890" y="435" class="pin">D7 RX Slot</text>
    <circle cx="1000" cy="485" r="8" fill="#fff"/><text x="890" y="490" class="pin">D8 TX Slot</text>
  </g>

  <!-- Power note -->
  <rect x="90" y="140" width="420" height="135" class="module"/>
  <text x="120" y="175" class="label">전원 연결</text>
  <text x="120" y="205" class="small">USB 전원 또는 안정적인 5V 입력 사용</text>
  <text x="120" y="232" class="small">Uno 1, Uno 2, Wemos GND는 반드시 공통 연결</text>
  <path d="M510 235 L620 365" class="wireGnd"/>
  <text x="515" y="270" class="small">공통 GND</text>

  <!-- Gate Uno connector -->
  <rect x="80" y="360" width="430" height="230" class="module"/>
  <text x="110" y="395" class="label">Arduino Uno 1: 입구/출구 차단기</text>
  <text x="110" y="428" class="small">업로드: sketches/uno_gate/uno_gate.ino</text>
  <circle cx="455" cy="465" r="8" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="330" y="470" class="pin">Uno 1 D3 TX</text>
  <circle cx="455" cy="520" r="8" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="330" y="525" class="pin">Uno 1 D2 RX</text>
  <circle cx="455" cy="555" r="8" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="345" y="560" class="pin">Uno 1 GND</text>
  <path d="M455 465 L620 430" class="wireData"/>
  <path d="M620 485 L455 520" class="wireData"/>
  <path d="M455 555 L620 365" class="wireGnd thin"/>
  <text x="245" y="630" class="small">Uno D3(TX) → Wemos D5(RX)</text>
  <text x="245" y="655" class="small">Wemos D6(TX) → Uno D2(RX)</text>

  <!-- Slot Uno connector -->
  <rect x="1090" y="360" width="430" height="230" class="module"/>
  <text x="1120" y="395" class="label">Arduino Uno 2: 주차칸 감지</text>
  <text x="1120" y="428" class="small">업로드: sketches/uno_slots/uno_slots.ino</text>
  <circle cx="1135" cy="465" r="8" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="1155" y="470" class="pin">Uno 2 D3 TX</text>
  <circle cx="1135" cy="520" r="8" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="1155" y="525" class="pin">Uno 2 D2 RX</text>
  <circle cx="1135" cy="555" r="8" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="1155" y="560" class="pin">Uno 2 GND</text>
  <path d="M1135 465 L1000 430" class="wireData"/>
  <path d="M1000 485 L1135 520" class="wireData"/>
  <path d="M1135 555 L1000 365" class="wireGnd thin"/>
  <text x="1135" y="630" class="small">Uno 2 D3(TX) → Wemos D7(RX)</text>
  <text x="1135" y="655" class="small">Wemos D8(TX) → Uno 2 D2(RX)</text>

  <!-- Fee server -->
  <rect x="1090" y="710" width="430" height="160" class="note"/>
  <text x="1120" y="745" class="label">Node.js Express 요금 서버</text>
  <text x="1120" y="775" class="small">기본 주소: http://192.168.0.10:3000</text>
  <text x="1120" y="802" class="small">GET /parking/entry?slot=번호</text>
  <text x="1120" y="827" class="small">GET /parking/exit?slot=번호</text>
  <path d="M945 305 C1100 235, 1280 250, 1390 360" class="wireWifi"/>
  <path d="M945 330 C1130 430, 1210 600, 1305 710" class="wireWifi"/>
  <text x="1090" y="282" class="small">Wi-Fi 연결</text>

  <!-- Logic note -->
  <rect x="90" y="710" width="480" height="190" class="note"/>
  <text x="120" y="745" class="label">게이트웨이 동작 흐름</text>
  <text x="120" y="775" class="small">1. Uno 2가 ENTRY/VACATED 이벤트 전송</text>
  <text x="120" y="802" class="small">2. Wemos가 서버에 입차/출차 요청 전송</text>
  <text x="120" y="829" class="small">3. 빈자리 수를 Uno 1에 EMPTY,n 형태로 전달</text>
  <text x="120" y="856" class="small">4. Uno 1의 BARRIER_EXIT 수신 후 요금 응답 전달</text>

  <!-- Level note -->
  <rect x="600" y="835" width="420" height="105" class="note"/>
  <text x="630" y="870" class="label">전압 주의</text>
  <text x="630" y="900" class="small">Uno TX는 5V 신호, Wemos RX는 3.3V 계열입니다.</text>
  <text x="630" y="925" class="small">권장: Uno TX → Wemos RX 구간은 분압/레벨시프터 사용</text>

  <!-- Legend -->
  <rect x="600" y="690" width="420" height="110" class="module"/>
  <text x="630" y="725" class="label">배선 색상</text>
  <line x1="630" y1="750" x2="695" y2="750" class="wireData"/><text x="710" y="755" class="small">SoftwareSerial 데이터</text>
  <line x1="630" y1="775" x2="695" y2="775" class="wireGnd"/><text x="710" y="780" class="small">공통 GND</text>
  <line x1="820" y1="750" x2="885" y2="750" class="wireWifi"/><text x="900" y="755" class="small">Wi-Fi/API</text>
</svg>
