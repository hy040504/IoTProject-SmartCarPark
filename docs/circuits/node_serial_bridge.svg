<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 16px Arial, sans-serif; fill: #172033; }
    .small { font: 13px Arial, sans-serif; fill: #526070; }
    .box { fill: #f7f9fc; stroke: #172033; stroke-width: 2; rx: 12; }
    .module { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 10; }
    .note { fill: #fff8dc; stroke: #b58900; stroke-width: 1.5; rx: 8; }
    .wireUsb { stroke: #5f6368; stroke-width: 5; fill: none; }
    .wireApi { stroke: #0f9d58; stroke-width: 4; fill: none; stroke-dasharray: 12 10; }
  </style>

  <rect width="1600" height="950" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Node.js Serial Bridge 회로도 - Uno 2대 USB Serial 구조</text>
  <text x="60" y="88" class="subtitle">실행 폴더: 요금 (NodeJs Server)/fee-server</text>

  <rect x="590" y="170" width="430" height="560" class="box"/>
  <rect x="655" y="250" width="300" height="280" fill="#263238" stroke="#111827" stroke-width="3" rx="14"/>
  <text x="700" y="305" font-family="Arial" font-size="30" font-weight="700" fill="#fff">PC / Node.js</text>
  <text x="700" y="345" class="label" fill="#dff8ee">Express + serialport</text>
  <text x="690" y="400" font-family="Arial" font-size="16" fill="#dff8ee">GATE_SERIAL_PORT=COM3</text>
  <text x="690" y="430" font-family="Arial" font-size="16" fill="#dff8ee">SLOT_SERIAL_PORT=COM5</text>
  <text x="690" y="460" font-family="Arial" font-size="16" fill="#dff8ee">SERIAL_BAUD_RATE=9600</text>

  <rect x="95" y="210" width="420" height="210" class="module"/>
  <text x="125" y="250" class="label">Arduino Uno 1</text>
  <text x="125" y="282" class="small">sketches/uno_gate/uno_gate.ino</text>
  <text x="125" y="315" class="small">입구/출구 조도센서, 차단기, LCD</text>
  <text x="125" y="350" class="small">수신: EMPTY,n / FEE,slot,fee</text>
  <text x="125" y="380" class="small">송신: BARRIER_EXIT</text>
  <path d="M515 315 L590 350" class="wireUsb"/>
  <text x="525" y="300" class="small">USB Serial</text>

  <rect x="1085" y="210" width="420" height="210" class="module"/>
  <text x="1115" y="250" class="label">Arduino Uno 2</text>
  <text x="1115" y="282" class="small">sketches/uno_slots/uno_slots.ino</text>
  <text x="1115" y="315" class="small">주차칸 초음파센서, 칸별 LED</text>
  <text x="1115" y="350" class="small">송신: ENTRY,slot / VACATED,slot</text>
  <text x="1115" y="380" class="small">수신 없음</text>
  <path d="M1020 350 L1085 315" class="wireUsb"/>
  <text x="1025" y="300" class="small">USB Serial</text>

  <rect x="590" y="610" width="430" height="180" class="note"/>
  <text x="625" y="645" class="label">서버 내부 상태</text>
  <text x="625" y="675" class="small">slotOccupied: 1번/2번 점유 여부</text>
  <text x="625" y="705" class="small">parkingSessions: 슬롯별 입차 시간</text>
  <text x="625" y="735" class="small">pendingExitSlots: 출차 대기 슬롯</text>
  <text x="625" y="765" class="small">출차 시 FEE,slot,fee를 Uno 1에 전송</text>

  <rect x="95" y="555" width="420" height="235" class="note"/>
  <text x="125" y="590" class="label">실행 순서</text>
  <text x="125" y="622" class="small">1. Node.js 서버 종료</text>
  <text x="125" y="652" class="small">2. Uno 1/Uno 2 각각 업로드</text>
  <text x="125" y="682" class="small">3. 두 Uno를 USB로 PC에 연결</text>
  <text x="125" y="712" class="small">4. COM 포트 확인 후 npm start</text>
  <text x="125" y="742" class="small">5. 서버 콘솔에서 이벤트 로그 확인</text>

  <rect x="1085" y="555" width="420" height="235" class="note"/>
  <text x="1115" y="590" class="label">주의사항</text>
  <text x="1115" y="622" class="small">서버가 COM 포트를 열면 IDE 업로드 불가</text>
  <text x="1115" y="652" class="small">업로드 전 npm 서버를 종료해야 함</text>
  <text x="1115" y="682" class="small">Arduino IDE 시리얼 모니터도 같은 포트 사용 불가</text>
  <text x="1115" y="712" class="small">로그는 Node.js 콘솔에서 확인</text>

  <rect x="590" y="820" width="430" height="85" class="module"/>
  <text x="625" y="855" class="label">HTTP API</text>
  <text x="625" y="885" class="small">http://localhost:3000/parking/sessions</text>
  <path d="M805 530 C850 560, 890 580, 930 610" class="wireApi"/>
</svg>
