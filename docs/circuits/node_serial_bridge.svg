<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="950" viewBox="0 0 1650 950">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 700 22px Arial, sans-serif; fill: #172033; }
    .small { font: 16px Arial, sans-serif; fill: #344054; }
    .box { fill: #f7f9fc; stroke: #172033; stroke-width: 2; rx: 12; }
    .module { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 10; }
    .note { fill: #fff8dc; stroke: #b58900; stroke-width: 1.5; rx: 8; }
    .wireUsb { stroke: #5f6368; stroke-width: 5; fill: none; }
    .wireApi { stroke: #0f9d58; stroke-width: 4; fill: none; stroke-dasharray: 12 10; }
  </style>

  <rect width="1650" height="950" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Node.js Serial Bridge</text>
  <text x="60" y="88" class="subtitle">Uno 1, Uno 2, Uno 3 are connected over USB Serial.</text>

  <rect x="600" y="150" width="450" height="560" class="box"/>
  <rect x="665" y="220" width="320" height="340" fill="#263238" stroke="#111827" stroke-width="3" rx="14"/>
  <text x="710" y="275" font-family="Arial" font-size="30" font-weight="700" fill="#fff">PC / Node.js</text>
  <text x="710" y="315" class="small" fill="#dff8ee">Express + serialport</text>
  <text x="700" y="370" class="small" fill="#dff8ee">GATE_SERIAL_PORT=COM3</text>
  <text x="700" y="400" class="small" fill="#dff8ee">SLOT_SERIAL_PORT=COM5</text>
  <text x="700" y="430" class="small" fill="#dff8ee">LCD_SERIAL_PORT=COM7</text>
  <text x="700" y="460" class="small" fill="#dff8ee">SERIAL_BAUD_RATE=9600</text>

  <rect x="95" y="160" width="430" height="210" class="module"/>
  <text x="125" y="205" class="label">Arduino Uno 1</text>
  <text x="125" y="240" class="small">sketches/uno_gate/uno_gate.ino</text>
  <text x="125" y="275" class="small">Entrance/exit light sensors + barrier control</text>
  <text x="125" y="310" class="small">Sends EMPTY and BARRIER_EXIT</text>
  <path d="M525 270 L600 320" class="wireUsb"/>

  <rect x="1125" y="160" width="430" height="210" class="module"/>
  <text x="1155" y="205" class="label">Arduino Uno 2</text>
  <text x="1155" y="240" class="small">sketches/uno_slots/uno_slots.ino</text>
  <text x="1155" y="275" class="small">Two slot ultrasonic sensors + LEDs</text>
  <text x="1155" y="310" class="small">Sends ENTRY and VACATED</text>
  <path d="M1050 320 L1125 270" class="wireUsb"/>

  <rect x="600" y="760" width="450" height="150" class="module"/>
  <text x="630" y="805" class="label">Arduino Uno 3</text>
  <text x="630" y="840" class="small">sketches/uno_lcd/uno_lcd.ino</text>
  <text x="630" y="875" class="small">Exit LCD only, receives LCD_STATUS and LCD_EXIT_FEE</text>
  <path d="M825 560 L825 760" class="wireUsb"/>

  <rect x="95" y="460" width="430" height="200" class="note"/>
  <text x="125" y="500" class="label">Server role</text>
  <text x="125" y="535" class="small">Stores slot state and counts empty spaces.</text>
  <text x="125" y="565" class="small">Matches exit events with pending vacated slots.</text>
  <text x="125" y="595" class="small">Sends exit fee to Uno 3 LCD.</text>
  <path d="M525 560 C610 560, 640 580, 600 610" class="wireApi"/>

  <rect x="1125" y="460" width="430" height="200" class="note"/>
  <text x="1155" y="500" class="label">LCD commands</text>
  <text x="1155" y="535" class="small">LCD_STATUS: current occupied / total</text>
  <text x="1155" y="565" class="small">LCD_EXIT_FEE: slot number and fee</text>
  <text x="1155" y="595" class="small">Only exit LCD commands are used now.</text>

  <rect x="95" y="715" width="430" height="135" class="note"/>
  <text x="125" y="755" class="label">Run order</text>
  <text x="125" y="790" class="small">1. Upload Uno sketches</text>
  <text x="125" y="820" class="small">2. Check USB ports</text>
  <text x="125" y="850" class="small">3. Start Node.js server</text>
</svg>
