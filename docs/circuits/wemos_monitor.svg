<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 16px Arial, sans-serif; fill: #172033; }
    .small { font: 13px Arial, sans-serif; fill: #526070; }
    .pin { font: 13px Arial, sans-serif; fill: #172033; }
    .box { fill: #f7f9fc; stroke: #172033; stroke-width: 2; rx: 12; }
    .module { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 10; }
    .note { fill: #fff8dc; stroke: #b58900; stroke-width: 1.5; rx: 8; }
    .wireUsb { stroke: #5f6368; stroke-width: 5; fill: none; }
    .wireWifi { stroke: #0f9d58; stroke-width: 4; fill: none; stroke-dasharray: 12 10; }
    .wireSerial { stroke: #9334e6; stroke-width: 4; fill: none; }
  </style>

  <rect width="1500" height="900" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Wemos Monitor 회로도 - 요금 서버 상태 조회</text>
  <text x="60" y="88" class="subtitle">업로드 파일: sketches/wemos_monitor/wemos_monitor.ino</text>

  <!-- Wemos board -->
  <rect x="530" y="160" width="440" height="560" class="box"/>
  <rect x="610" y="240" width="280" height="360" fill="#1f8f6b" stroke="#0b4f3b" stroke-width="3" rx="18"/>
  <text x="646" y="292" font-family="Arial" font-size="32" font-weight="700" fill="#fff">Wemos D1 R1</text>
  <text x="662" y="325" font-family="Arial" font-size="16" fill="#dff8ee">Monitor Wi-Fi Board</text>
  <text x="658" y="380" font-family="Arial" font-size="15" fill="#dff8ee">점퍼선 연결 없음</text>
  <text x="658" y="408" font-family="Arial" font-size="15" fill="#dff8ee">USB + Wi-Fi만 사용</text>

  <g>
    <circle cx="550" cy="335" r="8" fill="#fff"/><text x="565" y="340" class="pin">USB 5V</text>
    <circle cx="550" cy="385" r="8" fill="#fff"/><text x="565" y="390" class="pin">GND</text>
    <circle cx="950" cy="335" r="8" fill="#fff"/><text x="850" y="340" class="pin">Wi-Fi</text>
    <circle cx="950" cy="500" r="8" fill="#fff"/><text x="820" y="505" class="pin">USB Serial</text>
  </g>

  <!-- USB PC -->
  <rect x="85" y="250" width="370" height="220" class="module"/>
  <text x="120" y="290" class="label">PC / 노트북</text>
  <rect x="145" y="325" width="210" height="90" fill="#e8eaed" stroke="#3c4043" stroke-width="2" rx="8"/>
  <text x="205" y="378" class="label">Arduino IDE</text>
  <text x="120" y="445" class="small">USB 케이블로 업로드, 전원 공급, 시리얼 모니터 확인</text>
  <text x="120" y="468" class="small">시리얼 모니터: 115200 baud</text>
  <path d="M455 365 L550 335" class="wireUsb"/>
  <path d="M455 400 L950 500" class="wireSerial"/>

  <!-- Fee server -->
  <rect x="1050" y="250" width="370" height="250" class="note"/>
  <text x="1085" y="290" class="label">Node.js Express 요금 서버</text>
  <text x="1085" y="325" class="small">기본 URL</text>
  <text x="1085" y="350" class="small">http://192.168.0.10:3000/parking/sessions</text>
  <text x="1085" y="390" class="small">Wemos가 5초마다 GET 요청</text>
  <text x="1085" y="420" class="small">응답은 USB Serial로 출력</text>
  <text x="1085" y="450" class="small">서버 PC IP로 URL 수정 필요</text>
  <path d="M950 335 C1030 250, 1180 210, 1235 250" class="wireWifi"/>

  <!-- Wi-Fi router -->
  <rect x="1050" y="585" width="370" height="145" class="module"/>
  <text x="1085" y="625" class="label">Wi-Fi 공유기</text>
  <text x="1085" y="660" class="small">WIFI_SSID / WIFI_PASSWORD 설정 필요</text>
  <text x="1085" y="690" class="small">서버 PC와 같은 네트워크 권장</text>
  <path d="M950 335 C1100 390, 1190 500, 1235 585" class="wireWifi"/>

  <!-- Logic -->
  <rect x="85" y="560" width="370" height="170" class="note"/>
  <text x="120" y="600" class="label">동작 흐름</text>
  <text x="120" y="632" class="small">1. USB로 Wemos 2에 스케치 업로드</text>
  <text x="120" y="660" class="small">2. Wi-Fi 연결 후 5초마다 sessions 호출</text>
  <text x="120" y="688" class="small">3. 서버 응답 JSON을 시리얼 모니터에 출력</text>

  <!-- No external wiring note -->
  <rect x="530" y="755" width="440" height="90" class="note"/>
  <text x="565" y="790" class="label">외부 센서 배선 없음</text>
  <text x="565" y="820" class="small">D핀, A핀, 5V, GND에 점퍼선을 연결하지 않습니다.</text>

  <!-- Legend -->
  <rect x="1050" y="765" width="370" height="85" class="module"/>
  <text x="1085" y="797" class="label">표기</text>
  <line x1="1085" y1="822" x2="1145" y2="822" class="wireUsb"/><text x="1160" y="827" class="small">USB 전원</text>
  <line x1="1260" y1="822" x2="1320" y2="822" class="wireWifi"/><text x="1335" y="827" class="small">Wi-Fi/API</text>
</svg>
