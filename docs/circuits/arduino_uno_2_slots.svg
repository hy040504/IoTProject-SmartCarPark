<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526070; }
    .label { font: 16px Arial, sans-serif; fill: #172033; }
    .small { font: 13px Arial, sans-serif; fill: #526070; }
    .pin { font: 13px Arial, sans-serif; fill: #172033; }
    .box { fill: #f7f9fc; stroke: #172033; stroke-width: 2; rx: 12; }
    .module { fill: #ffffff; stroke: #1f2a44; stroke-width: 2; rx: 10; }
    .note { fill: #fff8dc; stroke: #b58900; stroke-width: 1.5; rx: 8; }
    .wire5v { stroke: #d93025; stroke-width: 4; fill: none; }
    .wireGnd { stroke: #202124; stroke-width: 4; fill: none; }
    .wireTrig { stroke: #1a73e8; stroke-width: 4; fill: none; }
    .wireEcho { stroke: #0f9d58; stroke-width: 4; fill: none; }
    .wireLed { stroke: #f29900; stroke-width: 4; fill: none; }
    .wireData { stroke: #9334e6; stroke-width: 4; fill: none; }
    .thin { stroke-width: 2.5; }
  </style>

  <rect width="1700" height="1150" fill="#eef3f8"/>
  <text x="60" y="58" class="title">Arduino Uno 2 회로도 - 주차칸 감지 및 LED 표시</text>
  <text x="60" y="88" class="subtitle">업로드 파일: sketches/uno_slots/uno_slots.ino</text>

  <!-- Arduino Uno -->
  <rect x="640" y="155" width="430" height="760" class="box"/>
  <rect x="705" y="220" width="300" height="560" fill="#2f80ed" stroke="#0f376f" stroke-width="3" rx="18"/>
  <text x="745" y="270" font-family="Arial" font-size="34" font-weight="700" fill="#fff">Arduino UNO</text>
  <text x="758" y="304" font-family="Arial" font-size="16" fill="#d9ecff">Board 2: Slot Controller</text>

  <!-- Uno pins left -->
  <g>
    <circle cx="660" cy="350" r="8" fill="#fff"/><text x="675" y="355" class="pin">5V</text>
    <circle cx="660" cy="395" r="8" fill="#fff"/><text x="675" y="400" class="pin">GND</text>
    <circle cx="660" cy="455" r="8" fill="#fff"/><text x="675" y="460" class="pin">D2 RX</text>
    <circle cx="660" cy="510" r="8" fill="#fff"/><text x="675" y="515" class="pin">D3 TX</text>
    <circle cx="660" cy="575" r="8" fill="#fff"/><text x="675" y="580" class="pin">D4 TRIG 1</text>
    <circle cx="660" cy="630" r="8" fill="#fff"/><text x="675" y="635" class="pin">D5 ECHO 1</text>
    <circle cx="660" cy="695" r="8" fill="#fff"/><text x="675" y="700" class="pin">D6 TRIG 2</text>
    <circle cx="660" cy="750" r="8" fill="#fff"/><text x="675" y="755" class="pin">D7 ECHO 2</text>
  </g>

  <!-- Uno pins right -->
  <g>
    <circle cx="1050" cy="470" r="8" fill="#fff"/><text x="975" y="475" class="pin">D8 R1</text>
    <circle cx="1050" cy="525" r="8" fill="#fff"/><text x="975" y="530" class="pin">D9 G1</text>
    <circle cx="1050" cy="590" r="8" fill="#fff"/><text x="970" y="595" class="pin">D10 R2</text>
    <circle cx="1050" cy="645" r="8" fill="#fff"/><text x="970" y="650" class="pin">D11 G2</text>
  </g>

  <!-- Power rails -->
  <rect x="85" y="135" width="455" height="115" class="module"/>
  <text x="115" y="172" class="label">브레드보드 전원 레일</text>
  <line x1="125" y1="205" x2="505" y2="205" class="wire5v"/>
  <text x="515" y="210" class="small">+5V</text>
  <line x1="125" y1="230" x2="505" y2="230" class="wireGnd"/>
  <text x="515" y="235" class="small">GND</text>
  <path d="M660 350 L540 350 L540 205" class="wire5v"/>
  <path d="M660 395 L560 395 L560 230" class="wireGnd"/>

  <!-- Slot 1 ultrasonic -->
  <rect x="80" y="310" width="470" height="220" class="module"/>
  <text x="115" y="345" class="label">1번 주차칸 HC-SR04</text>
  <rect x="145" y="385" width="255" height="90" fill="#e8f0fe" stroke="#174ea6" stroke-width="2" rx="8"/>
  <circle cx="205" cy="430" r="24" fill="#d7e3fc" stroke="#174ea6" stroke-width="2"/>
  <circle cx="340" cy="430" r="24" fill="#d7e3fc" stroke="#174ea6" stroke-width="2"/>
  <text x="185" y="435" class="small">T</text>
  <text x="322" y="435" class="small">E</text>
  <text x="115" y="500" class="small">VCC→5V, GND→GND, TRIG→D4, ECHO→D5</text>
  <path d="M540 205 L430 205 L430 395" class="wire5v"/>
  <path d="M560 230 L455 230 L455 455" class="wireGnd"/>
  <path d="M660 575 L400 420" class="wireTrig"/>
  <path d="M400 440 L660 630" class="wireEcho"/>

  <!-- Slot 2 ultrasonic -->
  <rect x="80" y="570" width="470" height="220" class="module"/>
  <text x="115" y="605" class="label">2번 주차칸 HC-SR04</text>
  <rect x="145" y="645" width="255" height="90" fill="#e8f0fe" stroke="#174ea6" stroke-width="2" rx="8"/>
  <circle cx="205" cy="690" r="24" fill="#d7e3fc" stroke="#174ea6" stroke-width="2"/>
  <circle cx="340" cy="690" r="24" fill="#d7e3fc" stroke="#174ea6" stroke-width="2"/>
  <text x="185" y="695" class="small">T</text>
  <text x="322" y="695" class="small">E</text>
  <text x="115" y="760" class="small">VCC→5V, GND→GND, TRIG→D6, ECHO→D7</text>
  <path d="M540 205 L420 205 L420 655" class="wire5v"/>
  <path d="M560 230 L450 230 L450 715" class="wireGnd"/>
  <path d="M660 695 L400 680" class="wireTrig"/>
  <path d="M400 700 L660 750" class="wireEcho"/>

  <!-- Slot LEDs -->
  <rect x="1135" y="305" width="470" height="260" class="module"/>
  <text x="1170" y="340" class="label">1번 주차칸 LED</text>
  <circle cx="1215" cy="405" r="22" fill="#ff6b6b" stroke="#9b1c1c" stroke-width="2"/>
  <text x="1199" y="410" class="small">RED</text>
  <rect x="1280" y="390" width="75" height="30" fill="#ffe0b2" stroke="#a15c00"/>
  <text x="1291" y="411" class="small">220Ω</text>
  <circle cx="1215" cy="485" r="22" fill="#7bd88f" stroke="#137333" stroke-width="2"/>
  <text x="1192" y="490" class="small">GREEN</text>
  <rect x="1280" y="470" width="75" height="30" fill="#ffe0b2" stroke="#a15c00"/>
  <text x="1291" y="491" class="small">220Ω</text>
  <text x="1170" y="535" class="small">D8→저항→빨강 LED→GND, D9→저항→초록 LED→GND</text>
  <path d="M1050 470 L1280 405" class="wireLed"/>
  <path d="M1050 525 L1280 485" class="wireLed"/>
  <path d="M1215 427 L1215 555 L560 555 L560 230" class="wireGnd thin"/>
  <path d="M1215 507 L1235 570 L560 570 L560 230" class="wireGnd thin"/>

  <rect x="1135" y="620" width="470" height="260" class="module"/>
  <text x="1170" y="655" class="label">2번 주차칸 LED</text>
  <circle cx="1215" cy="720" r="22" fill="#ff6b6b" stroke="#9b1c1c" stroke-width="2"/>
  <text x="1199" y="725" class="small">RED</text>
  <rect x="1280" y="705" width="75" height="30" fill="#ffe0b2" stroke="#a15c00"/>
  <text x="1291" y="726" class="small">220Ω</text>
  <circle cx="1215" cy="800" r="22" fill="#7bd88f" stroke="#137333" stroke-width="2"/>
  <text x="1192" y="805" class="small">GREEN</text>
  <rect x="1280" y="785" width="75" height="30" fill="#ffe0b2" stroke="#a15c00"/>
  <text x="1291" y="806" class="small">220Ω</text>
  <text x="1170" y="850" class="small">D10→저항→빨강 LED→GND, D11→저항→초록 LED→GND</text>
  <path d="M1050 590 L1280 720" class="wireLed"/>
  <path d="M1050 645 L1280 800" class="wireLed"/>
  <path d="M1215 742 L1215 875 L560 875 L560 230" class="wireGnd thin"/>
  <path d="M1215 822 L1235 895 L560 895 L560 230" class="wireGnd thin"/>

  <!-- Wemos gateway connector -->
  <rect x="80" y="850" width="520" height="170" class="note"/>
  <text x="115" y="885" class="label">Wemos Gateway 연결</text>
  <text x="115" y="918" class="small">Uno 2 D3(TX) → Wemos Gateway D7(RX)</text>
  <text x="115" y="945" class="small">Wemos Gateway D8(TX) → Uno 2 D2(RX)</text>
  <text x="115" y="972" class="small">Uno 2 GND ↔ Wemos Gateway GND 공통 연결</text>
  <path d="M660 510 L600 918" class="wireData"/>
  <path d="M600 945 L660 455" class="wireData"/>
  <path d="M560 230 L600 972" class="wireGnd thin"/>

  <!-- Notes -->
  <rect x="640" y="950" width="430" height="120" class="note"/>
  <text x="675" y="985" class="label">감지 기준</text>
  <text x="675" y="1015" class="small">SLOT_OCCUPIED_DISTANCE_CM = 5cm</text>
  <text x="675" y="1042" class="small">5cm 이하 감지 시 해당 칸을 점유 상태로 처리</text>

  <!-- Legend -->
  <rect x="1135" y="930" width="470" height="140" class="module"/>
  <text x="1170" y="965" class="label">배선 색상</text>
  <line x1="1170" y1="990" x2="1235" y2="990" class="wire5v"/><text x="1250" y="995" class="small">5V</text>
  <line x1="1170" y1="1015" x2="1235" y2="1015" class="wireGnd"/><text x="1250" y="1020" class="small">GND</text>
  <line x1="1350" y1="990" x2="1415" y2="990" class="wireTrig"/><text x="1430" y="995" class="small">TRIG</text>
  <line x1="1350" y1="1015" x2="1415" y2="1015" class="wireEcho"/><text x="1430" y="1020" class="small">ECHO</text>
  <line x1="1170" y1="1040" x2="1235" y2="1040" class="wireLed"/><text x="1250" y="1045" class="small">LED 신호</text>
  <line x1="1350" y1="1040" x2="1415" y2="1040" class="wireData"/><text x="1430" y="1045" class="small">Wemos 통신</text>
</svg>
